server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.(js|mjs|wasm)$ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        try_files $uri =404;
    }
}
