services:
  tools:
    build:
      context: .
      dockerfile: Dockerfile.tests
    volumes:
      - .:/work
      - ${SAMPLE_DIRECTORY:-./artifacts}:/samples:ro
    working_dir: /work
    environment:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      SAMPLE_FITS: ${CONTAINER_SAMPLE_FITS:-}
    shm_size: 1gb
    ulimits:
      core:
        soft: 0
        hard: 0
  web:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${HRDIAGRAM_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  lint-js:
    image: node:22.16.0-bookworm-slim
    volumes:
      - .:/work
    working_dir: /work
